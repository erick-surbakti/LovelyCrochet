# Testimonials must be REAL customer words, used with permission.
#
# - Copy the text exactly as the customer wrote it (fix typos only).
# - Set `permission: true` only after the customer agreed to be quoted.
# - Use first name + initial, never a full name or phone number.
# - `sample: true` entries are placeholders. They are shown only in `npm run dev`
#   (labelled "Sample") and are NEVER rendered in production HTML or in
#   AggregateRating / Review schema. Delete them once real entries exist.
#
# Production renders a testimonial (and adds it to Review schema) only when
# `permission: true` and `sample: false`.


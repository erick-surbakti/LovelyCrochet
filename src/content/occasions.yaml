- id: wisuda
  order: 1
  image: boneka-husky-rajut-amigurumi-kotak-kado
  relatedJournal: [ide-kado-wisuda-unik]
  slug: { id: 'kado-wisuda', en: 'graduation-gifts' }
  name: { id: 'Wisuda', en: 'Graduation' }
  title: { id: 'Kado Wisuda Unik yang Tidak Akan Layu', en: 'Unique Graduation Gifts That Never Wilt' }
  seoTitle:
    id: 'Kado Wisuda Unik: Boneka & Buket Rajut Bekasi | Simpul Mungil'
    en: 'Unique Graduation Gifts, Crochet Dolls & Bouquets | Simpul Mungil'
  seoDescription:
    id: 'Kado wisuda unik dari Bekasi. Boneka rajut dalam kotak kado dan buket bunga rajut custom warna almamater. Same-day ke kampus di Jabodetabek.'
    en: 'Unique graduation gifts from Bekasi. Gift-boxed crochet dolls and custom crochet bouquets in campus colours. Same-day to Jabodetabek campuses.'
  when:
    {
      id: 'Puncak musim wisuda biasanya Februari–April dan Agustus–Oktober.',
      en: 'Indonesian graduation season usually peaks in February–April and August–October.',
    }
  lede:
    id: Setelah bertahun-tahun begadang mengerjakan tugas dan skripsi, kado wisuda sebaiknya juga bisa disimpan bertahun-tahun.
    en: After years of late nights and a thesis, a graduation gift should last for years too.
  body:
    id:
      - Bunga segar akan layu sebelum foto wisudanya sempat dicetak. Rajutan tangan tetap utuh di meja kerja pertama si wisudawan atau di rak kamarnya. Boneka seperti husky atau Hello Kitty dalam kotak kado bisa langsung diberikan saat sesi foto, sedangkan buket bunga rajut bisa dibuat custom dengan warna almamater.
      - Semua boneka kami dibuat sesuai pesanan, jadi hitung mundur dari tanggal wisuda. Untuk boneka kecil, pesan minimal 1 minggu sebelumnya. Untuk boneka besar dan buket custom, minimal 2 minggu. Kami bisa mengirim lewat GoSend atau GrabExpress langsung ke gedung wisuda di Bekasi dan Jabodetabek.
    en:
      - Fresh flowers wilt before the graduation photos are even printed. Hand-crocheted gifts stay intact on the graduate's first work desk or bedroom shelf. A gift-boxed doll like the husky or Hello Kitty is ready to hand over at the photo session, and a crochet bouquet can be made to order in campus colours.
      - Every doll is made to order, so count back from the ceremony date. For small dolls, order at least a week ahead. For large dolls and custom bouquets, at least two weeks. We can deliver by GoSend or GrabExpress straight to the venue in Bekasi and Jabodetabek.
  tips:
    id:
      - Kirim foto jas almamater jika ingin warna buket disamakan.
      - Untuk pengiriman ke gedung wisuda, cantumkan nama penerima dan nomor HP yang aktif di hari H.
      - Pesan lebih awal di bulan Februari–April dan Agustus–Oktober karena antrean pesanan biasanya lebih panjang.
    en:
      - Send a photo of the university jacket if you want the bouquet colours to match.
      - For delivery to the venue, include the recipient's name and a phone number they'll answer on the day.
      - Order early in February–April and August–October, when order queues tend to be longer.

- id: ulang-tahun

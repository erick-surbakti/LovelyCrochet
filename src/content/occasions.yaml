  relatedJournal: [rajutan-tangan-vs-pabrik]
  slug: { id: 'kado-anniversary', en: 'anniversary-gifts' }
  name: { id: 'Anniversary', en: 'Anniversary' }
  title: { id: 'Kado Anniversary Handmade untuk yang Tersayang', en: 'Handmade Anniversary Gifts for Your Person' }
  seoTitle:
    id: 'Kado Anniversary Handmade untuk Pacar & Pasangan | Simpul Mungil'
    en: 'Handmade Anniversary Gifts for Your Partner | Simpul Mungil'
  seoDescription:
    id: 'Kado anniversary handmade dari Bekasi. Boneka rajut lucu, buket bunga rajut abadi, dan tas rajut custom untuk pasangan. Dikirim ke seluruh Indonesia.'
    en: 'Handmade anniversary gifts from Bekasi. Cute crochet dolls, everlasting crochet bouquets and custom crochet bags for your partner. Ships nationwide.'
  lede:
    id: Kado yang dibuat pelan-pelan, tusuk demi tusuk, untuk hubungan yang ingin terus kamu rawat.
    en: A gift made slowly, stitch by stitch, for a relationship you want to keep tending.
  body:
    id:
      - Setiap boneka rajut butuh waktu, kesabaran, dan perhatian pada detail. Itu juga yang dibutuhkan sebuah hubungan. Boneka seperti penguin bertopi atau husky berbandana bisa jadi pengingat kecil di meja pasanganmu, sedangkan buket bunga rajut tidak akan layu seperti bunga segar.
      - Kalau ingin yang lebih personal, pilih warna kesukaan pasanganmu atau minta warna syal dan bandana disesuaikan. Pesan jauh-jauh hari, karena boneka besar butuh 7–14 hari kerja.
    en:
      - Every crochet doll takes time, patience and attention to detail, just like a relationship. A penguin in a hat or a husky in a bandana makes a small reminder on your partner's desk, and a crochet bouquet will never wilt like fresh flowers.
      - For something more personal, pick your partner's favourite colours or ask for the scarf or bandana colour to be changed. Order well ahead, because large dolls take 7–14 working days.
  tips:
    id:
      - Sebutkan warna favorit pasangan saat memesan.
      - Sebutkan jika ingin dikirim ke kantor pasangan sebagai kejutan.
      - Tambahkan kartu ucapan berisi pesanmu.
    en:
      - Mention your partner's favourite colours when you order.
      - Let us know if you'd like it delivered to your partner's office as a surprise.
      - Add a greeting card with your message.


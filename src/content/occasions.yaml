  seoTitle:
    id: 'Kado Ulang Tahun Handmade, Boneka Rajut Unik | Simpul Mungil'
    en: 'Handmade Birthday Gifts, Crochet Dolls | Simpul Mungil'
  seoDescription:
    id: 'Kado ulang tahun handmade untuk pacar, sahabat, dan anak. Boneka rajut karakter, hewan lucu, dan gantungan kunci dari Bekasi. Kirim ke seluruh Indonesia.'
    en: 'Handmade birthday gifts for partners, friends and kids. Crochet character dolls, cute animals and keychains from Bekasi. Ships across Indonesia.'
  lede:
    id: Kado ulang tahun terbaik adalah yang membuat penerimanya berpikir, "Dia benar-benar ingat aku suka ini."
    en: The best birthday gift makes someone think, "They really remembered I love this."
  body:
    id:
      - Rajutan tangan punya kelebihan yang sulit ditandingi barang pabrik, yaitu bisa disesuaikan dengan orangnya. Penggemar Sanrio bisa dapat Hello Kitty dengan overall warna favoritnya, penggemar Disney bisa dapat Donald Duck, dan pecinta anjing bisa dapat husky atau gantungan kunci anjing.
      - Kirim tanggal ulang tahun saat chat. Karena boneka dibuat sesuai pesanan, kami hitung mundur dari tanggalnya supaya kado sampai tepat waktu, termasuk untuk pengiriman ke luar kota.
    en:
      - Hand-crocheted gifts have an advantage factory goods can't match. They can be made for one particular person. A Sanrio fan can get Hello Kitty in their favourite overall colour, a Disney fan can get Donald Duck, and a dog lover can get the husky or the puppy keychain.
      - Tell us the birthday date when you chat. Because dolls are made to order, we count back from the date so the gift arrives on time, including out-of-town deliveries.
  tips:
    id:
      - Ceritakan 2–3 hal yang disukai penerima, misalnya warna, hewan, atau karakter favorit.
      - Tambahkan pilihan kotak kado supaya boneka siap diberikan.
      - Untuk kejutan, sebutkan jika paket tidak boleh mencantumkan harga.
    en:
      - Tell us 2–3 things the recipient loves, like a colour, an animal or a favourite character.
      - Add the gift box option so the doll is ready to give.
      - For surprises, let us know if no price should appear in the parcel.

- id: anniversary
  order: 3

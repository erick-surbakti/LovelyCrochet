  title: { id: 'Kado Hari Ibu 22 Desember yang Dibuat dengan Tangan', en: "Handmade Gifts for Indonesian Mother's Day, 22 December" }
  seoTitle:
    id: 'Kado Hari Ibu 22 Desember, Handmade & Bermakna | Simpul Mungil'
    en: "Mother's Day Gifts Indonesia (22 Dec), Handmade | Simpul Mungil"
  seoDescription:
    id: 'Kado Hari Ibu 22 Desember dari Bekasi. Boneka kelinci rajut, buket bunga rajut, tas rajut, dan renda rajut untuk baju ibu. Kirim ke seluruh Indonesia.'
    en: "Gifts for Indonesian Mother's Day on 22 December. A crochet bunny, crochet bouquets, bags and crochet lace for mum. Ships nationwide."
  when:
    {
      id: 'Hari Ibu di Indonesia diperingati setiap 22 Desember.',
      en: "Indonesia celebrates Mother's Day (Hari Ibu) on 22 December every year.",
    }
  lede:
    id: Ibu mengajarimu banyak hal dengan sabar. Kado yang dibuat tusuk demi tusuk terasa seperti ucapan terima kasih yang pantas.
    en: Mum taught you so much, patiently. A gift made stitch by stitch feels like a fitting thank-you.
  body:
    id:
      - Hari Ibu jatuh setiap 22 Desember, berdekatan dengan libur akhir tahun. Kami sarankan memesan paling lambat awal Desember agar kado sampai tepat waktu, terutama untuk pengiriman ke luar Jawa yang sering terlambat saat musim liburan.
      - Untuk ibu yang suka hal-hal lembut dan manis, boneka kelinci rajut dengan syal biru bisa jadi pajangan di kamar. Untuk ibu yang lebih suka barang yang dipakai sehari-hari, tas rajut atau renda rajut untuk mempercantik kebaya dan kerudungnya bisa dibuat custom sesuai warna kesukaannya.
    en:
      - "Indonesian Mother's Day falls on 22 December, right before the year-end holidays. We suggest ordering by early December so the gift arrives on time, especially outside Java, where deliveries often slow down in the holiday rush."
      - For a mum who loves soft, sweet things, the crochet bunny with its blue scarf makes a lovely bedroom keepsake. For a mum who prefers everyday things, a crochet bag or crochet lace to dress up her kebaya or headscarf can be made to order in her favourite colours.
  tips:
    id:
      - Pesan paling lambat awal Desember untuk pengiriman luar kota.
      - Untuk renda, ukur diam-diam keliling kerah atau ujung lengan baju yang ingin dipercantik.
      - Warna favorit ibu lebih berkesan daripada warna yang sedang tren.
    en:
      - Order by early December for out-of-town delivery.
      - For lace, quietly measure the collar or cuff of the piece you want to dress up.
      - Mum's favourite colour means more than whatever is trending.


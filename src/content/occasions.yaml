  image: gantungan-kunci-anjing-amigurumi-rajut
  relatedJournal: [berapa-jam-merajut-boneka]
  slug: { id: 'kado-korporat', en: 'corporate-gifts' }
  name: { id: 'Kado Korporat', en: 'Corporate Gifts' }
  title: { id: 'Kado Korporat dan Suvenir Kantor Handmade', en: 'Handmade Corporate Gifts and Office Favours' }
  seoTitle:
    id: 'Souvenir Perusahaan Handmade & Corporate Gift Rajut | Simpul Mungil'
    en: 'Handmade Corporate Gifts from Indonesia | Simpul Mungil'
  seoDescription:
    id: 'Souvenir perusahaan handmade dari Bekasi. Gantungan kunci rajut dengan warna brand dan boneka rajut dalam kotak kado untuk klien dan karyawan.'
    en: 'Handmade corporate gifts from Bekasi. Crochet keychains in brand colours and gift-boxed crochet dolls for clients and staff.'
  lede:
    id: Suvenir kantor biasanya berakhir di laci. Suvenir rajut biasanya berakhir di gantungan kunci dan meja kerja.
    en: Most office giveaways end up in a drawer. Crochet ones end up on key rings and desks.
  body:
    id:
      - Gantungan kunci rajut adalah pilihan suvenir yang praktis karena ringan, dipakai setiap hari, dan warnanya bisa disesuaikan dengan warna brand. Untuk klien penting, boneka rajut dalam kotak kado bisa jadi hadiah akhir tahun yang berkesan.
      - Karena semuanya dirajut tangan, kapasitas kami terbatas. Kirim jumlah, desain, dan tanggal acaramu lewat WhatsApp, lalu kami hitung waktu pengerjaan dan harganya sebelum kamu memutuskan. Pembayaran memakai DP 50%.
    en:
      - Crochet keychains are a practical giveaway because they're light, used every day and can be made in your brand colours. For key clients, a gift-boxed crochet doll makes a memorable year-end present.
      - Because everything is hand-crocheted, our capacity is limited. Send your quantity, design and event date on WhatsApp, and we'll work out the timeline and price before you decide. Payment is by 50% deposit.
  tips:
    id:
      - Kirim kode warna brand (HEX atau Pantone) supaya benang bisa kami cocokkan.
      - Hubungi kami jauh-jauh hari untuk pesanan dalam jumlah banyak.
      - Minta satu contoh dulu sebelum pesanan besar dikerjakan.
    en:
      - Send your brand colour codes (HEX or Pantone) so we can match the yarn.
      - Contact us well ahead for large quantities.
      - Ask for one sample before a large order goes into production.

- id: baby-shower
  order: 7
  image: boneka-kelinci-rajut-krem-syal-biru
  relatedJournal: [jenis-benang-rajut-untuk-pemula]
  slug: { id: 'kado-baby-shower', en: 'baby-shower-gifts' }
  name: { id: 'Baby Shower & Lahiran', en: 'Baby Shower & Newborn' }
  title: { id: 'Kado Baby Shower dan Lahiran yang Lembut', en: 'Soft Baby Shower and Newborn Gifts' }
  seoTitle:
    id: 'Kado Baby Shower & Lahiran Rajut Handmade | Simpul Mungil'
    en: 'Handmade Baby Shower & Newborn Gifts | Simpul Mungil'
  seoDescription:
    id: 'Kado baby shower dan lahiran rajut dari Bekasi. Boneka kelinci dan penguin rajut yang lembut, jadi pajangan dan kenang-kenangan di kamar si kecil.'
    en: "Crochet baby shower and newborn gifts from Bekasi. Soft crochet bunnies and penguins that become nursery keepsakes."
  lede:
    id: Kado yang cukup cantik untuk dipajang di kamar si kecil dan disimpan jadi kenang-kenangan.
    en: A gift pretty enough to decorate the nursery and keep as a memento.
  body:
    id:
      - Boneka kelinci krem atau penguin bertopi adalah kado yang manis untuk menyambut si kecil. Ukurannya besar dan empuk, cocok jadi pajangan di kamar bayi dan teman bermain saat si kecil sudah lebih besar.
      - Perlu diingat, boneka kami memakai mata plastik dan beberapa punya kancing, jadi ditujukan untuk usia 3 tahun ke atas. Untuk bayi, letakkan sebagai pajangan dan jauhkan dari jangkauannya. Kalau ingin versi yang lebih aman untuk bayi, chat kami dulu.
    en:
      - A beige bunny or a penguin in a hat is a sweet way to welcome a little one. They're large and soft, lovely as nursery decor now and as a playmate when the child is older.
      - Please note that our dolls have plastic eyes and some have buttons, so they're meant for ages 3 and up. For babies, keep the doll as decoration out of reach. If you'd like a safer version for a baby, message us first.
  tips:
    id:
      - Warna netral seperti krem dan biru muda cocok jika jenis kelamin bayi belum diketahui.
      - Pilih opsi kotak kado untuk kunjungan ke rumah sakit atau rumah.
      - Untuk pengiriman ke rumah sakit, pastikan nama pasien dan nomor kamar sudah benar.
    en:
      - Neutral colours like beige and light blue work when you don't know the baby's sex.
      - Choose the gift box option for hospital or home visits.
      - For hospital deliveries, double-check the patient's name and room number.

